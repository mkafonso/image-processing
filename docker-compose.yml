services:
  redis:
    image: redis:7.4
    container_name: redis
    ports:
      - "6379:6379"
    restart: always

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend-api
    command: sh -c "npm install --workspaces && npm run --workspace=@image-processing/backend start"
    environment:
      NODE_ENV: development
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FIREBASE_SERVICE_ACCOUNT_KEY_BASE64: ""
    ports:
      - "3000:3000"
    depends_on:
      - redis
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    volumes:
      - ./:/usr/src/app
    working_dir: /usr/src/app

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend-worker
    command: sh -c "npm install --workspaces && npm run --workspace=@image-processing/backend start:worker"
    environment:
      NODE_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FIREBASE_SERVICE_ACCOUNT_KEY_BASE64: ""
    depends_on:
      - redis
    restart: unless-stopped
    volumes:
      - ./:/usr/src/app
    working_dir: /usr/src/app

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:3000/api"
    container_name: frontend
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    environment:
      NODE_ENV: development
